name: Setup Bun dependencies
description: Install Bun and dependencies exactly from bun.lock, caching Bun's package cache (caller must checkout first)

runs:
  using: composite
  steps:
    # The Bun version lives in the root `.bun-version` file (single source of truth for CI and local dev).
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # Cache Bun's global package cache, not node_modules: a stale node_modules restored from a
    # partial key could hide packages missing from bun.lock. Install always runs against the lockfile.
    - name: Cache Bun package cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-cache-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
