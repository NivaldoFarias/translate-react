name: Run Translation Workflow

on:
  workflow_call:
    inputs:
      matrix_json:
        description: JSON array of translation matrix rows from upstream poll
        required: true
        type: string
      environment:
        description: GitHub Environment for secrets and protection rules
        required: false
        type: string
        default: production
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      langs:
        description: Comma-separated locale ids (empty = all configured locales)
        required: false
        type: string
        default: ""
      file_path:
        description: Optional repository path for targeted re-translation
        required: false
        type: string
        default: ""
      llm_model:
        description: Optional LLM model override
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  prepare-matrix:
    name: Prepare matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_matrix: ${{ steps.select.outputs.has_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # `github.event_name` in a called workflow is the caller's event (`schedule` /
      # `workflow_dispatch`), never `workflow_call`, so key on `matrix_json` instead.
      - name: Generate Bot Token
        if: inputs.matrix_json == ''
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve matrix for manual run
        if: inputs.matrix_json == ''
        id: resolve
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          LANGS: ${{ inputs.langs }}
        run: bun run ci:resolve-matrix --langs "$LANGS"

      - name: Select matrix
        id: select
        env:
          POLLED_MATRIX: ${{ inputs.matrix_json }}
          RESOLVED_MATRIX: ${{ steps.resolve.outputs.matrix }}
        run: bun run ci:select-matrix

  workflow:
    name: Sync & Translate
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.environment || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    concurrency:
      group: translation-${{ matrix.lang }}-${{ github.ref }}
      # Queue a newer run instead of cancelling one mid-commit, which can leave a branch moved but its PR not updated.
      cancel-in-progress: false
    steps:
      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Resolve translation targets
        id: translation-target
        env:
          FILE_PATH: ${{ inputs.file_path }}
        run: bun run ci:resolve-translation-targets -- --file-path "$FILE_PATH"

      - name: Run translation workflow (${{ matrix.lang }})
        id: translate
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOG_TO_CONSOLE: ${{ vars.LOG_TO_CONSOLE }}
          LLM_MODEL: ${{ inputs.llm_model || vars.LLM_MODEL }}
          LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
          MAX_RETRY_ATTEMPTS: ${{ vars.MAX_RETRY_ATTEMPTS }}
          MAX_LLM_CONCURRENCY: ${{ vars.MAX_LLM_CONCURRENCY }}
          LLM_MAX_REQUESTS_PER_MINUTE: ${{ vars.LLM_MAX_REQUESTS_PER_MINUTE }}
          MASK_VERBATIM_LARGE_FENCES: ${{ vars.MASK_VERBATIM_LARGE_FENCES }}
          MASK_VERBATIM_LARGE_FENCES_MIN_TOKENS: ${{ vars.MASK_VERBATIM_LARGE_FENCES_MIN_TOKENS }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          MAX_TOKENS: ${{ vars.MAX_TOKENS }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE }}
          MAX_FILES_PER_RUN: ${{ vars.MAX_FILES_PER_RUN }}
          MAX_OPEN_TRANSLATION_PRS: ${{ vars.MAX_OPEN_TRANSLATION_PRS }}
          GH_REQUEST_TIMEOUT: ${{ vars.GH_REQUEST_TIMEOUT }}
          HEADER_APP_URL: ${{ vars.HEADER_APP_URL }}
          HEADER_APP_TITLE: ${{ vars.HEADER_APP_TITLE }}
          # Explicit passthrough so Bun `import.meta.env` sees run metadata for PR/issue links.
          GITHUB_ACTIONS: true
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          # Matrix values and paths go through env (not `${{ }}` in the script) to avoid script injection.
          MATRIX_LANG: ${{ matrix.lang }}
          MATRIX_FORK_OWNER: ${{ matrix.fork_owner }}
          MATRIX_FORK_NAME: ${{ matrix.fork_name }}
          MATRIX_UPSTREAM_OWNER: ${{ matrix.upstream_owner }}
          MATRIX_UPSTREAM_NAME: ${{ matrix.upstream_name }}
          MATRIX_TRANSLATION_GUIDELINES_FILE: ${{ matrix.translation_guidelines_file }}
          TARGET_PATH: ${{ steps.translation-target.outputs.path }}
        run: |
          ARGS=(
            --lang "$MATRIX_LANG"
            --fork-owner "$MATRIX_FORK_OWNER"
            --fork-name "$MATRIX_FORK_NAME"
            --upstream-owner "$MATRIX_UPSTREAM_OWNER"
            --upstream-name "$MATRIX_UPSTREAM_NAME"
          )
          if [ -n "$MATRIX_TRANSLATION_GUIDELINES_FILE" ]; then
            ARGS+=(--translation-guidelines-file "$MATRIX_TRANSLATION_GUIDELINES_FILE")
          fi
          if [ -n "$TARGET_PATH" ]; then
            ARGS+=(--file "$TARGET_PATH")
          fi
          bun run start -- "${ARGS[@]}"

      # Hold the SHA while the run limits left files or a file failed, so the next poll runs again.
      - name: Record upstream SHA (${{ matrix.lang }})
        if: success() && steps.translation-target.outputs.has_target_paths != 'true' && steps.translate.outputs.has_backlog != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MATRIX_LANG: ${{ matrix.lang }}
          MATRIX_UPSTREAM_SHA: ${{ matrix.upstream_sha }}
        run: |
          VAR_NAME="UPSTREAM_SHA_$(echo "$MATRIX_LANG" | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          gh variable set "$VAR_NAME" --body "$MATRIX_UPSTREAM_SHA"

      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: translation-logs-${{ matrix.lang }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 90
