name: Smoke Workflow

run-name: Smoke (${{ inputs.files != '' && inputs.files || inputs.profile }}, ${{ inputs.lang }})

on:
  workflow_dispatch:
    inputs:
      profile:
        description: >
          quick: default CI slice; workflow: PR scenarios only; full: every *.md under tests/fixtures/md/.
        required: true
        type: choice
        options:
          - quick
          - workflow
          - full
        default: quick
      environment:
        description: GitHub Environment for LLM secrets and variables
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      lang:
        description: Target locale for the smoke run
        required: false
        type: choice
        options:
          - pt-br
          - ru
        default: pt-br
      files:
        description: >
          Optional comma-separated fixture basenames under tests/fixtures/md/ (overrides profile).
          Example: use-client.md or use-client.md,lazy.md
        required: false
        type: string
        default: ""
      llm_model:
        description: Optional LLM model override (replaces environment LLM_MODEL when set)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}

jobs:
  smoke:
    name: Real LLM workflow smoke (${{ inputs.files != '' && inputs.files || inputs.profile }}, ${{ inputs.lang }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run workflow smoke
        uses: ./.github/actions/run-workflow-smoke
        with:
          profile: ${{ inputs.profile }}
          lang: ${{ inputs.lang }}
          files: ${{ inputs.files }}
          bun-version: ${{ vars.BUN_VERSION }}
          gh-token: ${{ secrets.GH_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          node-env: ${{ vars.NODE_ENV }}
          log-level: ${{ vars.LOG_LEVEL }}
          log-to-console: ${{ vars.LOG_TO_CONSOLE }}
          llm-model: ${{ inputs.llm_model || vars.LLM_MODEL }}
          llm-api-base-url: ${{ vars.LLM_API_BASE_URL }}
          max-retry-attempts: ${{ vars.MAX_RETRY_ATTEMPTS }}
          max-llm-concurrency: ${{ vars.MAX_LLM_CONCURRENCY }}
          openai-project-id: ${{ secrets.OPENAI_PROJECT_ID }}
          gh-pat-token: ${{ secrets.GH_PAT_TOKEN }}
          max-tokens: ${{ vars.MAX_TOKENS }}
          batch-size: ${{ vars.BATCH_SIZE }}
          header-app-url: ${{ vars.HEADER_APP_URL }}
          header-app-title: ${{ vars.HEADER_APP_TITLE }}

      - name: Upload workflow smoke outputs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ inputs.lang }}-${{ inputs.files != '' && inputs.files || inputs.profile }}-${{ github.run_id }}
          path: artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14
